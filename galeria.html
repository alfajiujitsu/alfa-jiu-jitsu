<div id="visualizador" class="visualizador">

<span class="fechar" onclick="fecharFoto()">×</span>

<button class="anterior" onclick="fotoAnterior()">❮</button>

<img id="fotoGrande" src="" alt="">

<button class="proxima" onclick="proximaFoto()">❯</button>

</div> 
    
<script>

function filtrarGaleria(categoria) {

    const fotos = document.querySelectorAll('.foto');

    fotos.forEach(function(foto) {

        if (
            categoria === 'todos' ||
            foto.dataset.categoria === categoria
        ) {

            foto.style.display = 'block';

        } else {

            foto.style.display = 'none';

        }

    });

}
let fotosVisiveis = [];

let fotoAtual = 0;


function abrirFoto(imagem) {

    const fotos = document.querySelectorAll(".foto");

    fotosVisiveis = Array.from(fotos).filter(function(foto) {

        return foto.style.display !== "none";

    });


    fotoAtual = fotosVisiveis.findIndex(function(foto) {

        return foto.querySelector("img") === imagem;

    });


    mostrarFoto();

    document.getElementById("visualizador").style.display = "flex";

}


function mostrarFoto() {

    if (fotosVisiveis.length === 0) return;


    const imagem = fotosVisiveis[fotoAtual].querySelector("img");


    document.getElementById("fotoGrande").src = imagem.src;

    document.getElementById("fotoGrande").alt = imagem.alt;

}


function fotoAnterior() {

    if (fotosVisiveis.length === 0) return;


    fotoAtual--;


    if (fotoAtual < 0) {

        fotoAtual = fotosVisiveis.length - 1;

    }


    mostrarFoto();

}


function proximaFoto() {

    if (fotosVisiveis.length === 0) return;


    fotoAtual++;


    if (fotoAtual >= fotosVisiveis.length) {

        fotoAtual = 0;

    }


    mostrarFoto();

}


function fecharFoto() {

    document.getElementById("visualizador").style.display = "none";

}
    
</script>

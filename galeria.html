<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria - Alfa Jiu Jitsu Academy</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Início</a>
            <a href="historia.html">Nossa História</a>
            <a href="professores.html">Professores</a>
            <a href="horarios.html">Horários</a>
            <a href="eventos.html">Eventos</a>
            <a href="galeria.html">Galeria</a>
        </nav>

        <h1>ALFA JIU JITSU ACADEMY</h1>
        <p>Disciplina • Respeito • Evolução</p>
    </header>

    <main>
        <section>
            <h2>Galeria</h2>
            <p>Momentos da nossa equipe dentro e fora do tatame.</p>

            <div class="filtros">
                <button onclick="filtrarGaleria('todos')">Todos</button>
                <button onclick="filtrarGaleria('kids')">Kids</button>
                <button onclick="filtrarGaleria('adultos')">Adultos</button>
                <button onclick="filtrarGaleria('eventos')">Eventos</button>
                <button onclick="filtrarGaleria('graduacoes')">Graduações</button>
                <button onclick="filtrarGaleria('campeonatos')">Campeonatos</button>
            </div>

            <div class="galeria" id="galeriaFotos">
                <p id="carregando">Carregando fotos...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>ALFA JIU JITSU ACADEMY</p>
        <p>Disciplina • Respeito • Evolução</p>
        <p>© 2026 Alfa Jiu Jitsu Academy</p>
    </footer>

    <div id="visualizador" class="visualizador">
        <span class="fechar" onclick="fecharFoto()">×</span>
        <button class="anterior" onclick="fotoAnterior()">❮</button>
        <img id="fotoGrande" src="" alt="">
        <button class="proxima" onclick="proximaFoto()">❯</button>
    </div>

    <script>
        const SUPABASE_URL = "https://zlfcnqjcxflcecrcfhyc.supabase.co";
        // Chave anon JWT clássica configurada
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsZmNucWpjeGZsY2VjcmNmaHljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzODY1MjUsImV4cCI6MjEwMTk2MjUyNX0.YtNYhsM_ctV2HpsGJJOlSzLS_v_4vGp-82aFTaqibaI"; 
        const BUCKET = "galeria";

        // Inicializa o cliente oficial do Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const categorias = [
            "kids",
            "adultos",
            "eventos",
            "graduacoes",
            "campeonatos"
        ];

        const nomesCategorias = {
            kids: "Turma Kids Alfa Jiu Jitsu",
            adultos: "Turma Adultos Alfa Jiu Jitsu",
            eventos: "Evento Alfa Jiu Jitsu",
            graduacoes: "Graduação Alfa Jiu Jitsu",
            campeonatos: "Campeonato Alfa Jiu Jitsu"
        };

        let fotosVisiveis = [];
        let fotoAtual = 0;

        /* ================================
           CARREGAR FOTOS VIA SUPABASE SDK
        ================================ */
        async function carregarFotos() {
            const galeria = document.getElementById("galeriaFotos");
            galeria.innerHTML = "";

            let quantidadeFotos = 0;

            for (const categoria of categorias) {
                try {
                    // Consulta os arquivos dentro da subpasta correspondente à categoria
                    const { data: arquivos, error } = await supabaseClient
                        .storage
                        .from(BUCKET)
                        .list(categoria, {
                            limit: 100,
                            offset: 0,
                            sortBy: { column: "name", order: "asc" }
                        });

                    if (error) {
                        console.error("Erro ao listar categoria:", categoria, error);
                        continue;
                    }

                    console.log("Arquivos encontrados:", categoria, arquivos);

                    arquivos.forEach(function(arquivo) {
                        // Ignora arquivos sem nome ou marcadores de pasta do Supabase
                        if (!arquivo.name || arquivo.name === ".emptyFolderPlaceholder") return;

                        const extensao = arquivo.name.split(".").pop().toLowerCase();

                        if (!["jpg", "jpeg", "png", "webp"].includes(extensao)) {
                            return;
                        }

                        const caminho = `${categoria}/${arquivo.name}`;

                        // Gera a URL pública do arquivo
                        const { data: urlData } = supabaseClient
                            .storage
                            .from(BUCKET)
                            .getPublicUrl(caminho);

                        criarFoto(categoria, urlData.publicUrl);
                        quantidadeFotos++;
                    });

                } catch (erro) {
                    console.error("Erro ao carregar:", categoria, erro);
                }
            }

            if (quantidadeFotos === 0) {
                galeria.innerHTML = "<p>Nenhuma foto encontrada.</p>";
            }

            atualizarFotosVisiveis();
        }

        /* ================================
           CRIAR FOTO NO DOM
        ================================ */
        function criarFoto(categoria, url) {
            const galeria = document.getElementById("galeriaFotos");
            const div = document.createElement("div");

            div.className = "foto";
            div.dataset.categoria = categoria;

            const imagem = document.createElement("img");
            imagem.src = url;
            imagem.alt = nomesCategorias[categoria] || "Foto Alfa Jiu Jitsu";
            imagem.loading = "lazy";

            imagem.onclick = function() {
                abrirFoto(imagem);
            };

            div.appendChild(imagem);
            galeria.appendChild(div);
        }

        /* ================================
           FILTRO DE CATEGORIAS
        ================================ */
        function filtrarGaleria(categoria) {
            const fotos = document.querySelectorAll(".foto");

            fotos.forEach(function(foto) {
                if (categoria === "todos" || foto.dataset.categoria === categoria) {
                    foto.style.display = "block";
                } else {
                    foto.style.display = "none";
                }
            });

            atualizarFotosVisiveis();
        }

        /* ================================
           ATUALIZAR FOTOS VISÍVEIS
        ================================ */
        function atualizarFotosVisiveis() {
            fotosVisiveis = Array.from(
                document.querySelectorAll(".foto")
            ).filter(function(foto) {
                return foto.style.display !== "none";
            });
        }

        /* ================================
           ABRIR LIGHTBOX
        ================================ */
        function abrirFoto(imagem) {
            atualizarFotosVisiveis();

            fotoAtual = fotosVisiveis.findIndex(function(foto) {
                return foto.querySelector("img") === imagem;
            });

            if (fotoAtual < 0) {
                fotoAtual = 0;
            }

            mostrarFoto();
            document.getElementById("visualizador").style.display = "flex";
        }

        /* ================================
           EXIBIR FOTO SELECIONADA
        ================================ */
        function mostrarFoto() {
            if (fotosVisiveis.length === 0) return;

            const imagem = fotosVisiveis[fotoAtual].querySelector("img");
            document.getElementById("fotoGrande").src = imagem.src;
            document.getElementById("fotoGrande").alt = imagem.alt;
        }

        /* ================================
           NAVEGAÇÃO (ANTERIOR / PRÓXIMA)
        ================================ */
        function fotoAnterior() {
            if (fotosVisiveis.length === 0) return;

            fotoAtual--;
            if (fotoAtual < 0) {
                fotoAtual = fotosVisiveis.length - 1;
            }
            mostrarFoto();
        }

        function proximaFoto() {
            if (fotosVisiveis.length === 0) return;

            fotoAtual++;
            if (fotoAtual >= fotosVisiveis.length) {
                fotoAtual = 0;
            }
            mostrarFoto();
        }

        /* ================================
           FECHAR LIGHTBOX
        ================================ */
        function fecharFoto() {
            document.getElementById("visualizador").style.display = "none";
        }

        /* ================================
           INICIALIZAÇÃO
        ================================ */
        carregarFotos();
    </script>

</body>

</html>

<main>

<section>

<h2>Galeria</h2>

<p>
Momentos da nossa equipe dentro e fora do tatame.
</p>


<div class="filtros">

<button onclick="filtrarGaleria('todos')">Todos</button>

<button onclick="filtrarGaleria('kids')">Kids</button>

<button onclick="filtrarGaleria('adultos')">Adultos</button>

<button onclick="filtrarGaleria('eventos')">Eventos</button>

<button onclick="filtrarGaleria('graduacoes')">Graduações</button>

<button onclick="filtrarGaleria('campeonatos')">Campeonatos</button>

</div>



<div class="galeria">


<div class="galeria">


<div class="foto" data-categoria="kids">

<img src="imagens/kids1.jpg"
     alt="Turma Kids Alfa Jiu Jitsu"
     onclick="abrirFoto(this)">

</div>


<div class="foto" data-categoria="adultos">

<img src="imagens/adultos1.jpg"
     alt="Turma Adultos Alfa Jiu Jitsu"
     onclick="abrirFoto(this)">

</div>


<div class="foto" data-categoria="eventos">

<img src="imagens/evento1.jpg"
     alt="Evento Alfa Jiu Jitsu"
     onclick="abrirFoto(this)">

</div>


<div class="foto" data-categoria="graduacoes">

<img src="imagens/graduacao1.jpg"
     alt="Graduação Alfa Jiu Jitsu"
     onclick="abrirFoto(this)">

</div>


</div>

</section>

</main>



<footer>

<p>ALFA JIU JITSU ACADEMY</p>

<p>Disciplina • Respeito • Evolução</p>

<p>© 2026 Alfa Jiu Jitsu Academy</p>

</footer>

<div id="visualizador" class="visualizador">

<span class="fechar" onclick="fecharFoto()">×</span>

<img id="fotoGrande" src="" alt="">

</div>
    
<script>

function filtrarGaleria(categoria) {

    const fotos = document.querySelectorAll('.foto');

    fotos.forEach(function(foto) {

        if (
            categoria === 'todos' ||
            foto.dataset.categoria === categoria
        ) {

            foto.style.display = 'block';

        } else {

            foto.style.display = 'none';

        }

    });

}
function abrirFoto(imagem) {

    const visualizador = document.getElementById("visualizador");

    const fotoGrande = document.getElementById("fotoGrande");

    visualizador.style.display = "flex";

    fotoGrande.src = imagem.src;

    fotoGrande.alt = imagem.alt;

}
    function fecharFoto() {

    document.getElementById("visualizador").style.display = "none";

}
    
</script>

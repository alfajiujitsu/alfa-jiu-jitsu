<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria - Alfa Jiu Jitsu Academy</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .filtros-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .filtro-mes {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Início</a>
            <a href="historia.html">Nossa História</a>
            <a href="professores.html">Professores</a>
            <a href="horarios.html">Horários</a>
            <a href="eventos.html">Eventos</a>
            <a href="galeria.html">Galeria</a>
            <a href="admin.html">Admin</a>
        </nav>

        <h1>ALFA JIU JITSU ACADEMY</h1>
        <p>Disciplina • Respeito • Evolução</p>
    </header>

    <main>
        <section>
            <h2>Galeria</h2>
            <p>Momentos da nossa equipe dentro e fora do tatame.</p>

            <div class="filtros-container">
                <!-- BOTÕES DE CATEGORIA -->
                <div class="filtros">
                    <button onclick="filtrarCategoria('todos')">Todos</button>
                    <button onclick="filtrarCategoria('kids')">Kids</button>
                    <button onclick="filtrarCategoria('adultos')">Adultos</button>
                    <button onclick="filtrarCategoria('eventos')">Eventos</button>
                    <button onclick="filtrarCategoria('graduacoes')">Graduações</button>
                    <button onclick="filtrarCategoria('campeonatos')">Campeonatos</button>
                </div>

                <!-- FILTRO DE MÊS -->
                <div>
                    <select id="selectMes" class="filtro-mes" onchange="filtrarMes(this.value)">
                        <option value="todos">Todos os Meses</option>
                        <option value="01-janeiro">Janeiro</option>
                        <option value="02-fevereiro">Fevereiro</option>
                        <option value="03-marco">Março</option>
                        <option value="04-abril">Abril</option>
                        <option value="05-maio">Maio</option>
                        <option value="06-junho">Junho</option>
                        <option value="07-julho">Julho</option>
                        <option value="08-agosto">Agosto</option>
                        <option value="09-setembro">Setembro</option>
                        <option value="10-outubro">Outubro</option>
                        <option value="11-novembro">Novembro</option>
                        <option value="12-dezembro">Dezembro</option>
                    </select>
                </div>
            </div>

            <div class="galeria" id="galeriaFotos">
                <p id="carregando">Carregando fotos...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>ALFA JIU JITSU ACADEMY</p>
        <p>Disciplina • Respeito • Evolução</p>
        <p>© 2026 Alfa Jiu Jitsu Academy</p>
    </footer>

    <div id="visualizador" class="visualizador">
        <span class="fechar" onclick="fecharFoto()">×</span>
        <button class="anterior" onclick="fotoAnterior()">❮</button>
        <img id="fotoGrande" src="" alt="">
        <button class="proxima" onclick="proximaFoto()">❯</button>
    </div>

    <script>
        const SUPABASE_URL = "https://zlfcnqjcxflcecrcfhyc.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsZmNucWpjeGZsY2VjcmNmaHljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzODY1MjUsImV4cCI6MjEwMTk2MjUyNX0.YtNYhsM_ctV2HpsGJJOlSzLS_v_4vGp-82aFTaqibaI"; 
        const BUCKET = "galeria";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const meses = [
            "01-janeiro", "02-fevereiro", "03-marco", "04-abril",
            "05-maio", "06-junho", "07-julho", "08-agosto",
            "09-setembro", "10-outubro", "11-novembro", "12-dezembro"
        ];

        const nomesCategorias = {
            kids: "Turma Kids Alfa Jiu Jitsu",
            adultos: "Turma Adultos Alfa Jiu Jitsu",
            eventos: "Evento Alfa Jiu Jitsu",
            graduacoes: "Graduação Alfa Jiu Jitsu",
            campeonatos: "Campeonato Alfa Jiu Jitsu"
        };

        let categoriaAtiva = "todos";
        let mesAtivo = "todos";
        let fotosVisiveis = [];
        let fotoAtual = 0;

        /* ================================
           CARREGAR TODAS AS PASTAS DO BUCKET
        ================================ */
        async function carregarFotos() {
            const galeria = document.getElementById("galeriaFotos");
            galeria.innerHTML = "";
            let quantidadeFotos = 0;

            try {
                // 1. Lista todas as pastas/arquivos da raiz do bucket
                const { data: itensRaiz, error } = await supabaseClient
                    .storage
                    .from(BUCKET)
                    .list("", { limit: 100 });

                if (error || !itensRaiz) {
                    galeria.innerHTML = "<p>Nenhuma foto encontrada.</p>";
                    return;
                }

                for (const item of itensRaiz) {
                    // Se o item for uma pasta (não tem extensão)
                    if (!item.id) {
                        const pastaNome = item.name;
                        // Determina a categoria limpa (ex: 'adultos01' vira 'adultos')
                        const categoriaBase = extrairCategoriaBase(pastaNome);

                        // A. Verifica arquivos na raiz dessa pasta
                        const fotosRaizPasta = await listarFotosPasta(pastaNome);
                        fotosRaizPasta.forEach(foto => {
                            criarFoto(categoriaBase, "sem-mes", foto.url);
                            quantidadeFotos++;
                        });

                        // B. Verifica arquivos nas subpastas de meses dentro dessa pasta
                        for (const mes of meses) {
                            const caminhoMes = `${pastaNome}/${mes}`;
                            const fotosMes = await listarFotosPasta(caminhoMes);

                            fotosMes.forEach(foto => {
                                criarFoto(categoriaBase, mes, foto.url);
                                quantidadeFotos++;
                            });
                        }
                    }
                }

                if (quantidadeFotos === 0) {
                    galeria.innerHTML = "<p>Nenhuma foto encontrada.</p>";
                }

                aplicarFiltros();

            } catch (err) {
                console.error("Erro ao carregar fotos:", err);
                galeria.innerHTML = "<p>Erro ao carregar fotos.</p>";
            }
        }

        // Mapeia nomes de pastas como 'adultos01' para 'adultos'
        function extrairCategoriaBase(nomePasta) {
            const pasta = nomePasta.toLowerCase();
            if (pasta.includes("adulto")) return "adultos";
            if (pasta.includes("kid")) return "kids";
            if (pasta.includes("evento")) return "eventos";
            if (pasta.includes("gradua")) return "graduacoes";
            if (pasta.includes("campeonato")) return "campeonatos";
            return pasta;
        }

        async function listarFotosPasta(caminho) {
            try {
                const { data: arquivos, error } = await supabaseClient
                    .storage
                    .from(BUCKET)
                    .list(caminho, { limit: 100 });

                if (error || !arquivos) return [];

                const fotosValidas = [];

                for (const arquivo of arquivos) {
                    if (!arquivo.name || arquivo.name === ".emptyFolderPlaceholder") continue;

                    const extensao = arquivo.name.split(".").pop().toLowerCase();
                    if (["jpg", "jpeg", "png", "webp"].includes(extensao)) {
                        const { data: urlData } = supabaseClient
                            .storage
                            .from(BUCKET)
                            .getPublicUrl(`${caminho}/${arquivo.name}`);

                        fotosValidas.push({ url: urlData.publicUrl });
                    }
                }
                return fotosValidas;
            } catch (err) {
                return [];
            }
        }

        /* ================================
           CRIAR ELEMENTO DE FOTO
        ================================ */
        function criarFoto(categoria, mes, url) {
            const galeria = document.getElementById("galeriaFotos");
            const div = document.createElement("div");

            div.className = "foto";
            div.dataset.categoria = categoria;
            div.dataset.mes = mes;

            const imagem = document.createElement("img");
            imagem.src = url;
            imagem.alt = nomesCategorias[categoria] || "Foto Alfa Jiu Jitsu";
            imagem.loading = "lazy";

            imagem.onclick = function() {
                abrirFoto(imagem);
            };

            div.appendChild(imagem);
            galeria.appendChild(div);
        }

        /* ================================
           LÓGICA DE FILTROS
        ================================ */
        function filtrarCategoria(categoria) {
            categoriaAtiva = categoria;
            aplicarFiltros();
        }

        function filtrarMes(mes) {
            mesAtivo = mes;
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const fotos = document.querySelectorAll(".foto");

            fotos.forEach(function(foto) {
                const bateCategoria = (categoriaAtiva === "todos" || foto.dataset.categoria === categoriaAtiva);
                const bateMes = (mesAtivo === "todos" || foto.dataset.mes === mesAtivo);

                if (bateCategoria && bateMes) {
                    foto.style.display = "block";
                } else {
                    foto.style.display = "none";
                }
            });

            atualizarFotosVisiveis();
        }

        function atualizarFotosVisiveis() {
            fotosVisiveis = Array.from(document.querySelectorAll(".foto")).filter(function(foto) {
                return foto.style.display !== "none";
            });
        }

        /* ================================
           LIGHTBOX
        ================================ */
        function abrirFoto(imagem) {
            atualizarFotosVisiveis();

            fotoAtual = fotosVisiveis.findIndex(function(foto) {
                return foto.querySelector("img") === imagem;
            });

            if (fotoAtual < 0) fotoAtual = 0;

            mostrarFoto();
            document.getElementById("visualizador").style.display = "flex";
        }

        function mostrarFoto() {
            if (fotosVisiveis.length === 0) return;
            const imagem = fotosVisiveis[fotoAtual].querySelector("img");
            document.getElementById("fotoGrande").src = imagem.src;
            document.getElementById("fotoGrande").alt = imagem.alt;
        }

        function fotoAnterior() {
            if (fotosVisiveis.length === 0) return;
            fotoAtual--;
            if (fotoAtual < 0) fotoAtual = fotosVisiveis.length - 1;
            mostrarFoto();
        }

        function proximaFoto() {
            if (fotosVisiveis.length === 0) return;
            fotoAtual++;
            if (fotoAtual >= fotosVisiveis.length) fotoAtual = 0;
            mostrarFoto();
        }

        function fecharFoto() {
            document.getElementById("visualizador").style.display = "none";
        }

        // Carrega ao iniciar
        carregarFotos();
    </script>

</body>

</html>

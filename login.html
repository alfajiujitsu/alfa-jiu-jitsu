<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Cadastro - Alfa Jiu Jitsu Academy</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animacoes.css">
    <link rel="stylesheet" href="css/responsivo.css">

    <style>
        .login-container {
            max-width: 450px;
            margin: 50px auto;
            background-color: #1c1c1c;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: left;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #333;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #888;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s, border-bottom 0.3s;
        }

        .tab-btn.active {
            color: #d4af37;
            border-bottom: 3px solid #d4af37;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #ccc;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #d4af37;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #d4af37;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #b49329;
        }

        .msg-status {
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .msg-erro { color: #ff5555; }
        .msg-sucesso { color: #25d366; }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Início</a>
            <a href="historia.html">Nossa História</a>
            <a href="professores.html">Professores</a>
            <a href="horarios.html">Horários</a>
            <a href="eventos.html">Eventos</a>
            <a href="graduacoes.html">Graduações</a>
            <a href="galeria.html">Galeria</a>
            <a href="contato.html">Contato</a>
            <a href="login.html">Login</a>
        </nav>

        <h1>ALFA JIU JITSU ACADEMY</h1>
        <p>Acesso e Cadastro de Alunos</p>
    </header>

    <main>
        <div class="login-container">
            <!-- ABAS PARA ALTERNAR ENTRE LOGIN E CADASTRO -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Entrar</button>
                <button class="tab-btn" onclick="switchTab('cadastro')">Cadastrar Aluno</button>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="formLogin" class="form-section active">
                <div class="form-group">
                    <label for="loginTipo">Tipo de Acesso</label>
                    <select id="loginTipo">
                        <option value="aluno">Aluno</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="loginEmail">E-mail</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="loginSenha">Senha</label>
                    <input type="password" id="loginSenha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-submit">Entrar no Sistema</button>
                <div id="msgLogin" class="msg-status msg-erro"></div>
            </form>

            <!-- FORMULÁRIO DE CADASTRO -->
            <form id="formCadastro" class="form-section">
                <div class="form-group">
                    <label for="cadNome">Nome Completo</label>
                    <input type="text" id="cadNome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="cadEmail">E-mail</label>
                    <input type="email" id="cadEmail" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="cadSenha">Senha</label>
                    <input type="password" id="cadSenha" placeholder="Crie uma senha" required>
                </div>

                <div class="form-group">
                    <label for="cadConfirmaSenha">Confirme a Senha</label>
                    <input type="password" id="cadConfirmaSenha" placeholder="Repita a senha" required>
                </div>

                <button type="submit" class="btn-submit">Criar Minha Conta</button>
                <div id="msgCadastro" class="msg-status"></div>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 Alfa Jiu Jitsu Academy. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Função para alternar as abas
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab-btn');
            const forms = document.querySelectorAll('.form-section');

            tabs.forEach(tab => tab.classList.remove('active'));
            forms.forEach(form => form.classList.remove('active'));

            if (tabName === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('formLogin').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('formCadastro').classList.add('active');
            }
        }

        // --- LÓGICA DE CADASTRO DE ALUNO ---
        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nome = document.getElementById('cadNome').value;
            const email = document.getElementById('cadEmail').value;
            const senha = document.getElementById('cadSenha').value;
            const confirmaSenha = document.getElementById('cadConfirmaSenha').value;
            const msgCadastro = document.getElementById('msgCadastro');

            if (senha !== confirmaSenha) {
                msgCadastro.className = "msg-status msg-erro";
                msgCadastro.innerText = "As senhas não coincidem! Tente novamente.";
                msgCadastro.style.display = "block";
                return;
            }

            // Busca os alunos cadastrados no localStorage
            let alunos = JSON.parse(localStorage.getItem('alunosCadastrados')) || [];

            // Verifica se o e-mail já existe
            const emailExiste = alunos.some(aluno => aluno.email === email);
            if (emailExiste) {
                msgCadastro.className = "msg-status msg-erro";
                msgCadastro.innerText = "Este e-mail já está cadastrado!";
                msgCadastro.style.display = "block";
                return;
            }

            // Salva o novo aluno
            alunos.push({ nome, email, senha });
            localStorage.setItem('alunosCadastrados', JSON.stringify(alunos));

            msgCadastro.className = "msg-status msg-sucesso";
            msgCadastro.innerText = "Cadastro realizado com sucesso! Alterne para 'Entrar' e faça seu login.";
            msgCadastro.style.display = "block";
            document.getElementById('formCadastro').reset();
        });

        // --- LÓGICA DE LOGIN ---
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();

            const tipo = document.getElementById('loginTipo').value;
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            const msgLogin = document.getElementById('msgLogin');

            msgLogin.style.display = "none";

            // VALIDAÇÃO DE ADMINISTRADOR
            if (tipo === 'admin') {
                // Insira abaixo o e-mail e a senha que você deseja usar para o ADM:
                if (email === 'jean.carlos.andrade.94@gmail.com' && senha === '@Codd20@20') {
                    localStorage.setItem('usuarioLogado', JSON.stringify({ tipo: 'admin', nome: 'Administrador' }));
                    window.location.href = 'admin.html';
                } else {
                    msgLogin.innerText = "E-mail ou senha de Administrador incorretos!";
                    msgLogin.style.display = "block";
                }
            } 
            // VALIDAÇÃO DE ALUNO
            else if (tipo === 'aluno') {
                let alunos = JSON.parse(localStorage.getItem('alunosCadastrados')) || [];
                const alunoEncontrado = alunos.find(aluno => aluno.email === email && aluno.senha === senha);

                if (alunoEncontrado) {
                    localStorage.setItem('usuarioLogado', JSON.stringify({ tipo: 'aluno', nome: alunoEncontrado.nome }));
                    window.location.href = 'reservas.html';
                } else {
                    msgLogin.innerText = "Aluno não encontrado ou senha incorreta! Faça o cadastro primeiro.";
                    msgLogin.style.display = "block";
                }
            }
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alfa Jiu Jitsu Academy</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animacoes.css">
    <link rel="stylesheet" href="css/responsivo.css">

    <style>
        .login-container {
            max-width: 400px;
            margin: 60px auto;
            background-color: #1c1c1c;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: left;
        }

        .login-container h2 {
            color: #d4af37;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #d4af37;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #d4af37;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-login:hover {
            background-color: #b49329;
        }

        .msg-erro {
            color: #ff5555;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Início</a>
            <a href="historia.html">Nossa História</a>
            <a href="professores.html">Professores</a>
            <a href="horarios.html">Horários</a>
            <a href="eventos.html">Eventos</a>
            <a href="graduacoes.html">Graduaçoes</a>
            <a href="galeria.html">Galeria</a>
            <a href="contato.html">Contato</a>
            <a href="login.html">Login</a>
        </nav>

        <h1>ALFA JIU JITSU ACADEMY</h1>
        <p>Área de Acesso</p>
    </header>

    <main>
        <div class="login-container">
            <h2>Acessar Conta</h2>
            
            <form id="formLogin">
                <div class="form-group">
                    <label for="tipoUsuario">Tipo de Acesso</label>
                    <select id="tipoUsuario" required>
                        <option value="aluno">Aluno (Reserva de Materiais)</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="usuario">Usuário / E-mail</label>
                    <input type="text" id="usuario" placeholder="Digite seu usuário" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
                <div id="msgErro" class="msg-erro">Usuário ou senha incorretos!</div>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 Alfa Jiu Jitsu Academy. Todos os direitos reservados.</p>
    </footer>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();

            const tipo = document.getElementById('tipoUsuario').value;
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const msgErro = document.getElementById('msgErro');

            // SIMULAÇÃO DE VALIDAÇÃO (Ajuste com suas senhas de preferência)
            if (tipo === 'admin') {
                if (usuario === 'admin' && senha === 'admin123') {
                    localStorage.setItem('usuarioLogado', JSON.stringify({ tipo: 'admin', nome: 'Administrador' }));
                    window.location.href = 'admin.html';
                } else {
                    msgErro.innerText = "Credenciais de Administrador incorretas!";
                    msgErro.style.display = 'block';
                }
            } else if (tipo === 'aluno') {
                if (usuario && senha) { // Aceita qualquer usuário/senha para teste de aluno
                    localStorage.setItem('usuarioLogado', JSON.stringify({ tipo: 'aluno', nome: usuario }));
                    window.location.href = 'reservas.html';
                } else {
                    msgErro.innerText = "Por favor, preencha todos os campos!";
                    msgErro.style.display = 'block';
                }
            }
        });
    </script>

</body>

</html>

<script>
    // --- GERENCIAMENTO DAS ABAS ---
    function trocarAba(element, nomeAba) {
        const btns = document.querySelectorAll('.tab-btn-adm');
        const secaos = document.querySelectorAll('.secao-adm');

        btns.forEach(b => b.classList.remove('active'));
        secaos.forEach(s => s.classList.remove('active'));

        element.classList.add('active');
        document.getElementById('aba-' + nomeAba).classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
        carregarProdutosAdmin();
        carregarMetodologiaAdmin();
        carregarGraduacoesAdmin();
        carregarEventosAdmin();
        carregarGaleriaAdmin();
        carregarBlackBeltsAdmin();
    });

    // Helper para ler arquivos de imagem
    function lerImagem(input, callback) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => callback(e.target.result);
            reader.readAsDataURL(input.files[0]);
        } else {
            callback(null);
        }
    }

    // ================= 1. PRODUTOS / SHOP =================
    document.getElementById('formProduto').addEventListener('submit', function(e) {
        e.preventDefault();
        lerImagem(document.getElementById('prodFoto'), foto => {
            const item = {
                id: Date.now(),
                nome: document.getElementById('prodNome').value,
                tamanho: document.getElementById('prodTamanho').value,
                qtd: parseInt(document.getElementById('prodQtd').value),
                preco: document.getElementById('prodPreco').value,
                foto: foto
            };
            let banco = JSON.parse(localStorage.getItem('produtosShop')) || [];
            banco.push(item);
            localStorage.setItem('produtosShop', JSON.stringify(banco));
            document.getElementById('formProduto').reset();
            carregarProdutosAdmin();
        });
    });

    function carregarProdutosAdmin() {
        const c = document.getElementById('listaProdutosAdmin');
        const items = JSON.parse(localStorage.getItem('produtosShop')) || [];
        c.innerHTML = items.length ? '' : '<p style="color:#888;">Nenhum produto cadastrado.</p>';
        items.forEach(p => {
            c.innerHTML += `
                <div class="card-adm-item">
                    <img src="${p.foto}">
                    <h4 style="color:#d4af37; margin:5px 0;">${p.nome}</h4>
                    <p style="margin:2px; color:#ccc;">Tamanho: ${p.tamanho} | Qtd: ${p.qtd}</p>
                    <p style="margin:2px; color:#25d366;">R$ ${p.preco}</p>
                    <button onclick="excluirItem('produtosShop', ${p.id}, carregarProdutosAdmin)" class="btn-excluir">Excluir</button>
                </div>`;
        });
    }

    // ================= 2. METODOLOGIA =================
    document.getElementById('formMetodologia').addEventListener('submit', function(e) {
        e.preventDefault();
        lerImagem(document.getElementById('metFoto'), foto => {
            const item = {
                id: Date.now(),
                titulo: document.getElementById('metTitulo').value,
                descricao: document.getElementById('metDescricao').value,
                foto: foto
            };
            let banco = JSON.parse(localStorage.getItem('metodologiaItems')) || [];
            banco.push(item);
            localStorage.setItem('metodologiaItems', JSON.stringify(banco));
            document.getElementById('formMetodologia').reset();
            carregarMetodologiaAdmin();
        });
    });

    function carregarMetodologiaAdmin() {
        const c = document.getElementById('listaMetodologiaAdmin');
        const items = JSON.parse(localStorage.getItem('metodologiaItems')) || [];
        c.innerHTML = items.length ? '' : '<p style="color:#888;">Nenhum conteúdo de metodologia cadastrado.</p>';
        items.forEach(m => {
            c.innerHTML += `
                <div class="card-adm-item">
                    <img src="${m.foto}">
                    <h4 style="color:#d4af37; margin:5px 0;">${m.titulo}</h4>
                    <p style="margin:5px 0; color:#aaa; font-size:13px;">${m.descricao}</p>
                    <button onclick="excluirItem('metodologiaItems', ${m.id}, carregarMetodologiaAdmin)" class="btn-excluir">Excluir</button>
                </div>`;
        });
    }

    // ================= 3. GRADUAÇÕES =================
    document.getElementById('formGraduacao').addEventListener('submit', function(e) {
        e.preventDefault();
        lerImagem(document.getElementById('gradFoto'), foto => {
            const item = {
                id: Date.now(),
                nome: document.getElementById('gradNome').value,
                faixa: document.getElementById('gradFaixa').value,
                data: document.getElementById('gradData').value,
                foto: foto
            };
            let banco = JSON.parse(localStorage.getItem('graduacoes')) || [];
            banco.push(item);
            localStorage.setItem('graduacoes', JSON.stringify(banco));
            document.getElementById('formGraduacao').reset();
            carregarGraduacoesAdmin();
        });
    });

    function carregarGraduacoesAdmin() {
        const c = document.getElementById('listaGraduacoesAdmin');
        const items = JSON.parse(localStorage.getItem('graduacoes')) || [];
        c.innerHTML = items.length ? '' : '<p style="color:#888;">Nenhuma graduação registrada.</p>';
        items.forEach(g => {
            const imgTag = g.foto ? `<img src="${g.foto}">` : '';
            c.innerHTML += `
                <div class="card-adm-item">
                    ${imgTag}
                    <h4 style="color:#d4af37; margin:5px 0;">${g.nome}</h4>
                    <p style="margin:2px; color:#ccc;">Faixa: ${g.faixa}</p>
                    <p style="margin:2px; color:#888;">Data: ${g.data}</p>
                    <button onclick="excluirItem('graduacoes', ${g.id}, carregarGraduacoesAdmin)" class="btn-excluir">Excluir</button>
                </div>`;
        });
    }

    // ================= 4. EVENTOS (COM SUPORTE A EDIÇÃO E FOTO) =================
    document.getElementById('formEvento').addEventListener('submit', function(e) {
        e.preventDefault();

        const idEdicao = document.getElementById('evId').value;
        const fileInput = document.getElementById('evFoto');

        lerImagem(fileInput, fotoBase64 => {
            let banco = JSON.parse(localStorage.getItem('eventos')) || [];

            if (idEdicao) {
                // MODO EDIÇÃO
                const index = banco.findIndex(ev => ev.id == idEdicao);
                if (index !== -1) {
                    banco[index].titulo = document.getElementById('evTitulo').value;
                    banco[index].data = document.getElementById('evData').value;
                    banco[index].local = document.getElementById('evLocal').value;
                    banco[index].desc = document.getElementById('evDesc').value;
                    // Atualiza a foto apenas se uma nova imagem for selecionada
                    if (fotoBase64) {
                        banco[index].foto = fotoBase64;
                    }
                }
            } else {
                // MODO CRIAÇÃO
                const novoItem = {
                    id: Date.now(),
                    titulo: document.getElementById('evTitulo').value,
                    data: document.getElementById('evData').value,
                    local: document.getElementById('evLocal').value,
                    desc: document.getElementById('evDesc').value,
                    foto: fotoBase64 || null
                };
                banco.push(novoItem);
            }

            localStorage.setItem('eventos', JSON.stringify(banco));
            cancelarEdicaoEvento();
            carregarEventosAdmin();
        });
    });

    function carregarEventosAdmin() {
        const c = document.getElementById('listaEventosAdmin');
        const items = JSON.parse(localStorage.getItem('eventos')) || [];
        c.innerHTML = items.length ? '' : '<p style="color:#888;">Nenhum evento cadastrado.</p>';
        items.forEach(ev => {
            const imgTag = ev.foto ? `<img src="${ev.foto}" alt="${ev.titulo}">` : '';
            c.innerHTML += `
                <div class="card-adm-item">
                    ${imgTag}
                    <h4 style="color:#d4af37; margin:5px 0;">${ev.titulo}</h4>
                    <p style="margin:2px; color:#ccc;">📅 ${ev.data} - 📍 ${ev.local}</p>
                    <p style="margin:5px 0; color:#aaa; font-size:13px;">${ev.desc}</p>
                    <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
                        <button onclick="prepararEdicaoEvento(${ev.id})" class="btn-salvar" style="padding: 6px 12px; margin: 0;">Editar</button>
                        <button onclick="excluirItem('eventos', ${ev.id}, carregarEventosAdmin)" class="btn-excluir" style="margin: 0;">Excluir</button>
                    </div>
                </div>`;
        });
    }

    function prepararEdicaoEvento(id) {
        const items = JSON.parse(localStorage.getItem('eventos')) || [];
        const ev = items.find(item => item.id === id);

        if (!ev) return;

        document.getElementById('evId').value = ev.id;
        document.getElementById('evTitulo').value = ev.titulo;
        document.getElementById('evData').value = ev.data;
        document.getElementById('evLocal').value = ev.local;
        document.getElementById('evDesc').value = ev.desc;

        document.getElementById('tituloFormEvento').innerText = '✏️ Editar Evento ou Campeonato';
        document.getElementById('btnSalvarEvento').innerText = 'Atualizar Evento';
        document.getElementById('btnCancelarEdicao').style.display = 'inline-block';

        const previewContainer = document.getElementById('previewFotoAtual');
        if (ev.foto) {
            previewContainer.innerHTML = `<p style="color:#ccc; font-size:12px; margin:2px 0;">Foto atual:</p><img src="${ev.foto}" style="max-height:80px; border-radius:4px;">`;
        } else {
            previewContainer.innerHTML = '';
        }

        // Rola a tela até o formulário de edição
        document.getElementById('formEvento').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelarEdicaoEvento() {
        document.getElementById('formEvento').reset();
        document.getElementById('evId').value = '';
        document.getElementById('tituloFormEvento').innerText = '🏆 Cadastrar Evento ou Campeonato';
        document.getElementById('btnSalvarEvento').innerText = 'Publicar Evento';
        document.getElementById('btnCancelarEdicao').style.display = 'none';
        document.getElementById('previewFotoAtual').innerHTML = '';
    }

    // ================= 5. GALERIA =================
    document.getElementById('formGaleria').addEventListener('submit', function(e) {
        e.preventDefault();
        lerImagem(document.getElementById('galFoto'), foto => {
            const item = {
                id: Date.now(),
                titulo: document.getElementById('galTitulo').value,
                categoria: document.getElementById('galCategoria').value,
                foto: foto
            };
            let banco = JSON.parse(localStorage.getItem('galeriaFotos')) || [];
            banco.push(item);
            localStorage.setItem('galeriaFotos', JSON.stringify(banco));
            document.getElementById('formGaleria').reset();
            carregarGaleriaAdmin();
        });
    });

    function carregarGaleriaAdmin() {
        const c = document.getElementById('listaGaleriaAdmin');
        const items = JSON.parse(localStorage.getItem('galeriaFotos')) || [];
        c.innerHTML = items.length ? '' : '<p style="color:#888;">Nenhuma foto cadastrada.</p>';
        items.forEach(g => {
            c.innerHTML += `
                <div class="card-adm-item">
                    <img src="${g.foto}">
                    <h4 style="color:#d4af37; margin:5px 0;">${g.titulo}</h4>
                    <p style="margin:2px; color:#aaa;">Categoria: ${g.categoria}</p>
                    <button onclick="excluirItem('galeriaFotos', ${g.id}, carregarGaleriaAdmin)" class="btn-excluir">Excluir</button>
                </div>`;
        });
    }

    // ================= 6. BLACK BELTS =================
    document.getElementById('formBlackBelt').addEventListener('submit', function(e) {
        e.preventDefault();
        lerImagem(document.getElementById('bbFoto'), foto => {
            const item = {
                id: Date.now(),
                nome: document.getElementById('bbNome').value,
                ano: document.getElementById('bbAno').value,
                grau: document.getElementById('bbGrau').value || 'Faixa Preta',
                historia: document.getElementById('bbHistoria').value,
                foto: foto
            };
            let banco = JSON.parse(localStorage.getItem('blackBelts')) || [];
            banco.push(item);
            localStorage.setItem('blackBelts', JSON.stringify(banco));
            document.getElementById('formBlackBelt').reset();
            carregarBlackBeltsAdmin();
        });
    });

    function carregarBlackBeltsAdmin() {
        const c = document.getElementById('listaBlackBeltsAdmin');
        if (!c) return;
        const items = JSON.parse(localStorage.getItem('blackBelts')) || [];
        c.innerHTML = items.length ? '' : '<p style="color:#888;">Nenhum faixa preta cadastrado.</p>';
        items.forEach(bb => {
            c.innerHTML += `
                <div class="card-adm-item">
                    <img src="${bb.foto}">
                    <h4 style="color:#d4af37; margin:5px 0;">${bb.nome}</h4>
                    <p style="margin:2px; color:#ccc;">Graduação: ${bb.ano} (${bb.grau})</p>
                    <p style="margin:5px 0; color:#aaa; font-size:12px; text-align:left;">${bb.historia}</p>
                    <button onclick="excluirItem('blackBelts', ${bb.id}, carregarBlackBeltsAdmin)" class="btn-excluir">Excluir</button>
                </div>`;
        });
    }

    // Função genérica de exclusão
    function excluirItem(chaveStorage, id, callback) {
        if (confirm("Deseja realmente remover este item?")) {
            let banco = JSON.parse(localStorage.getItem(chaveStorage)) || [];
            banco = banco.filter(i => i.id !== id);
            localStorage.setItem(chaveStorage, JSON.stringify(banco));
            callback();
        }
    }

    function logout() {
        localStorage.removeItem('usuarioLogado');
        window.location.href = 'login.html';
    }
</script>

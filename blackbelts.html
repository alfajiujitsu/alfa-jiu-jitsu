<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Belts - Alfa Jiu Jitsu</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animacoes.css">
    <link rel="stylesheet" href="css/responsivo.css">

    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container-bb {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header-voltar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1c1c1c;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-voltar:hover {
            background: #d4af37;
            color: #000;
        }

        .titulo-pagina {
            text-align: center;
            color: #d4af37;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .grid-blackbelts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card-bb {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card-bb:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
        }

        .card-bb-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-bottom: 3px solid #d4af37;
        }

        .card-bb-corpo {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-bb-nome {
            color: #fff;
            font-size: 1.5rem;
            margin: 0 0 5px 0;
        }

        .card-bb-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .card-bb-historia {
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-line;
        }

        .sem-registros {
            text-align: center;
            color: #888;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            padding: 60px 0;
        }
    </style>
</head>

<body>

    <main class="container-bb">
        <div class="header-voltar">
            <a href="index.html" class="btn-voltar">← Voltar para o Início</a>
            <span style="color: #666; font-size: 14px;">Alfa Jiu Jitsu Academy</span>
        </div>

        <h1 class="titulo-pagina">🥋 Hall dos Black Belts</h1>

        <div id="gridBlackBelts" class="grid-blackbelts">
            <!-- Cards renderizados dinamicamente via JS -->
        </div>
    </main>

    <footer style="text-align: center; padding: 30px; color: #666; border-top: 1px solid #222; margin-top: 60px;">
        <p>© 2026 Alfa Jiu Jitsu Academy. Todos os direitos reservados.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', carregarBlackBelts);

        function carregarBlackBelts() {
            const container = document.getElementById('gridBlackBelts');
            const lista = JSON.parse(localStorage.getItem('blackBelts')) || [];

            if (lista.length === 0) {
                container.innerHTML = `
                    <div class="sem-registros">
                        <p>Nenhum Faixa Preta cadastrado no momento.</p>
                    </div>`;
                return;
            }

            container.innerHTML = lista.map(bb => `
                <div class="card-bb">
                    <img src="${bb.foto}" alt="${bb.nome}" class="card-bb-img">
                    <div class="card-bb-corpo">
                        <h3 class="card-bb-nome">${bb.nome}</h3>
                        <div class="card-bb-badge">Faixa Preta desde ${bb.ano} ${bb.grau ? '• ' + bb.grau : ''}</div>
                        <p class="card-bb-historia">${bb.historia}</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>

</html>
